# PUERTOS EXPUESTOS AL HOST:
#   - http://localhost      → Frontend (React + Nginx)
#   - http://localhost:8000 → Backend API (FastAPI + Uvicorn)  [también: /docs y /redoc]
#   - localhost:5432        → PostgreSQL (acceso directo para clientes como DBeaver)

services:
  # ────────────────────────────
  # 🐘 PostgreSQL 17 — Base de datos principal
  # ────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: jovenes_al_ruedo_db
    restart: unless-stopped

    environment:
      # Variables configurables vía .env o entorno del host
      POSTGRES_USER: ${POSTGRES_USER:-jar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jar_password}
      POSTGRES_DB: ${POSTGRES_DB:-jovenes_al_ruedo}

    ports:
      - "5433:5432"

    volumes:
      - jovenes_al_ruedo_data:/var/lib/postgresql/data

    networks:
      - jovenes_al_ruedo_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jar_user} -d ${POSTGRES_DB:-jovenes_al_ruedo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────
  # 🐍 Backend — FastAPI + Uvicorn
  # ────────────────────────────
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: jovenes_al_ruedo_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./be/.env
    environment:
      # Conexión a la BD — "db" es el nombre del servicio PostgreSQL en esta misma red
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-jar_user}:${POSTGRES_PASSWORD:-jar_password}@db:5432/${POSTGRES_DB:-jovenes_al_ruedo}}
     
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    
      MAIL_SERVER: ${MAIL_SERVER:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@jovenes-al-ruedo.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-noreply@jovenes-al-ruedo.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Jovenes al Ruedo}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

    ports:
      - "8000:8000"

    volumes:
      - backend_uploads:/app/uploads

    networks:
      - jovenes_al_ruedo_network

  # ────────────────────────────
  # ⚛️ Frontend — React + Nginx
  # ────────────────────────────
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

    container_name: jovenes_al_ruedo_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - jovenes_al_ruedo_network

# ────────────────────────────
# 📦 Volúmenes nombrados
# ────────────────────────────
volumes:
  jovenes_al_ruedo_data:
  # Volumen para conservar imagenes, audios y documentos subidos por los usuarios
  backend_uploads:

# ────────────────────────────
# 🔌 Red interna
# ────────────────────────────
networks:
  jovenes_al_ruedo_network:
    driver: bridge
